  <style>
    /* =========================================================
       KIMPOOL — DESIGN SYSTEM
       Mobile First
    ========================================================= */

    :root {
      --black: #050708;
      --charcoal: #0b1110;
      --surface: #101817;
      --surface-2: #141d1b;
      --teal-dark: #0f766e;
      --teal: #14b8a6;
      --teal-soft: rgba(20, 184, 166, 0.12);
      --white: #f5f7f6;
      --muted: #a7b0ad;
      --muted-2: #707a77;
      --border: rgba(255, 255, 255, 0.09);
      --border-teal: rgba(20, 184, 166, 0.28);

      --container: 1180px;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;

      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);

      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      max-width: 100%;
      scroll-behavior: smooth;
      overflow-x: hidden;
      background: var(--black);
    }

    body {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 90% 0%, rgba(15, 118, 110, 0.10), transparent 28rem),
        var(--black);
      color: var(--white);
      font-family: "Cairo", sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.menu-open {
      overflow: hidden;
    }

    img,
    svg,
    video,
    iframe {
      max-width: 100%;
    }

    img {
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    ul {
      list-style: none;
    }

    section {
      width: 100%;
      max-width: 100%;
      position: relative;
    }

    .container {
      width: min(100% - 32px, var(--container));
      margin-inline: auto;
    }

    .en {
      font-family: "Manrope", sans-serif;
      letter-spacing: 0.02em;
    }

    .section {
      padding: 76px 0;
    }

    .section-header {
      margin-bottom: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal);
      font-family: "Manrope", sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--teal);
      display: inline-block;
    }

    .section-title {
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      line-height: 1.18;
      font-weight: 800;
      letter-spacing: -0.035em;
      max-width: 720px;
    }

    .section-description {
      color: var(--muted);
      margin-top: 15px;
      max-width: 650px;
      font-size: 0.96rem;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn {
      min-height: 50px;
      padding: 12px 20px;
      border-radius: 13px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      transition:
        transform .25s var(--ease),
        background .25s var(--ease),
        border-color .25s var(--ease),
        box-shadow .25s var(--ease);
      touch-action: manipulation;
    }

    .btn-primary {
      color: #03100e;
      background: var(--teal);
      box-shadow: 0 10px 30px rgba(20, 184, 166, 0.16);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #22c7b4;
      box-shadow: 0 15px 35px rgba(20, 184, 166, 0.24);
    }

    .btn-secondary {
      color: var(--white);
      background: rgba(255, 255, 255, 0.035);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: var(--border-teal);
      background: var(--teal-soft);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      background: rgba(5, 7, 8, 0.78);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
    }

    .brand-word {
      font-family: "Manrope", sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .desktop-nav {
      display: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-whatsapp {
      min-height: 42px;
      padding: 8px 13px;
      font-size: 0.78rem;
      border-radius: 11px;
    }

    .menu-toggle {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .menu-toggle svg {
      width: 21px;
      height: 21px;
    }

    .mobile-menu {
      position: fixed;
      inset: 70px 0 0;
      z-index: 999;
      background: rgba(5, 7, 8, 0.98);
      transform: translateY(-12px);
      opacity: 0;
      visibility: hidden;
      transition: .25s var(--ease);
      padding: 22px 16px;
      overflow-y: auto;
    }

    .mobile-menu.active {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: grid;
      gap: 6px;
    }

    .mobile-nav a {
      min-height: 52px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      border-radius: 12px;
      color: var(--muted);
      border: 1px solid transparent;
      font-weight: 700;
    }

    .mobile-nav a:hover,
    .mobile-nav a:focus-visible {
      color: var(--white);
      background: var(--teal-soft);
      border-color: var(--border-teal);
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 112px 0 55px;
      overflow: hidden;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(180deg, rgba(5,7,8,.38) 0%, rgba(5,7,8,.72) 60%, var(--black) 100%),
        linear-gradient(90deg, rgba(5,7,8,.88) 0%, rgba(5,7,8,.48) 100%),
        url("https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1800&q=85") center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 180px;
      background: linear-gradient(transparent, var(--black));
      z-index: -2;
      pointer-events: none;
    }

    .hero-content {
      max-width: 720px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 11px;
      margin-bottom: 18px;
      border: 1px solid rgba(20, 184, 166, 0.28);
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.11);
      color: #72e1d4;
      font-family: "Manrope", sans-serif;
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .hero-badge span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 12px var(--teal);
    }

    .hero-brand {
      color: var(--teal);
      font-family: "Manrope", sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      font-weight: 800;
      letter-spacing: .22em;
      margin-bottom: 9px;
    }

    .hero-title {
      font-size: clamp(2.25rem, 11vw, 5.4rem);
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -0.055em;
      max-width: 750px;
    }

    .hero-title strong {
      color: var(--teal);
      font-weight: 800;
    }

    .hero-text {
      margin-top: 19px;
      max-width: 610px;
      color: #d0d6d4;
      font-size: 0.96rem;
      line-height: 1.9;
    }

    .hero-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 27px;
      max-width: 420px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 17px;
      margin-top: 25px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .hero-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-meta-item svg {
      width: 14px;
      height: 14px;
      color: var(--teal);
    }

    /* =========================================================
       INTRO
    ========================================================= */

    .intro {
      padding: 36px 0 74px;
    }

    .intro-card {
      position: relative;
      overflow: hidden;
      padding: 25px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle at 100% 0%, rgba(20,184,166,.09), transparent 40%),
        linear-gradient(135deg, #0c1312, #090e0d);
    }

    .intro-card::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--teal);
    }

    .intro-card h2 {
      font-size: 1.45rem;
      line-height: 1.3;
      margin-bottom: 9px;
    }

    .intro-card p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* =========================================================
       SERVICES
    ========================================================= */

    .services {
      background: linear-gradient(180deg, var(--black), #080d0c);
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .service-card {
      position: relative;
      padding: 23px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
      transition:
        transform .3s var(--ease),
        border-color .3s var(--ease),
        background .3s var(--ease);
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-teal);
      background: linear-gradient(145deg, rgba(20,184,166,.08), rgba(255,255,255,.015));
    }

    .service-number {
      position: absolute;
      top: 17px;
      inset-inline-start: 18px;
      color: rgba(255,255,255,.09);
      font-family: "Manrope", sans-serif;
      font-size: 2.5rem;
      line-height: 1;
      font-weight: 800;
    }

    .service-icon {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      color: var(--teal);
      background: var(--teal-soft);
      border: 1px solid rgba(20,184,166,.15);
      margin-bottom: 17px;
    }

    .service-icon svg {
      width: 23px;
      height: 23px;
    }

    .service-card h3 {
      font-size: 1.02rem;
      margin-bottom: 7px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.75;
    }

    /* =========================================================
       B2B
    ========================================================= */

    .b2b {
      padding-top: 78px;
    }

    .b2b-card {
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-teal);
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 100% 20%, rgba(20,184,166,.17), transparent 35%),
        linear-gradient(135deg, #0c1715, #07100f);
      box-shadow: var(--shadow);
    }

    .b2b-content {
      padding: 29px 21px;
    }

    .b2b-title {
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      line-height: 1.16;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .b2b-text {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 650px;
    }

    .b2b-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 24px 0;
    }

    .b2b-list li {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      color: #d7dddb;
      font-size: 0.78rem;
    }

    .check {
      color: var(--teal);
      flex: 0 0 auto;
      margin-top: 4px;
    }

    /* =========================================================
       GALLERY
    ========================================================= */

    .gallery {
      padding-bottom: 80px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      min-width: 0;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .gallery-item:first-child {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .6s var(--ease);
    }

    .gallery-item:hover img {
      transform: scale(1.045);
    }

    .gallery-overlay {
      position: absolute;
      inset: auto 0 0;
      padding: 28px 14px 13px;
      background: linear-gradient(transparent, rgba(0,0,0,.78));
      pointer-events: none;
    }

    .gallery-overlay span {
      color: white;
      font-size: .73rem;
      font-weight: 700;
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    .video-section {
      padding-top: 20px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle, rgba(20,184,166,.12), transparent 45%),
        var(--surface);
      box-shadow: var(--shadow);
    }

    .video-box iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 25px;
    }

    .video-placeholder-inner {
      max-width: 400px;
    }

    .video-placeholder-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-teal);
      border-radius: 50%;
      color: var(--teal);
      background: var(--teal-soft);
    }

    .video-placeholder h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .video-placeholder p {
      color: var(--muted);
      font-size: .78rem;
    }

    /* =========================================================
       PROCESS
    ========================================================= */

    .process {
      background: #080d0c;
    }

    .process-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
    }

    .process-card {
      position: relative;
      display: grid;
      grid-template-columns: 55px 1fr;
      align-items: center;
      gap: 15px;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.02);
    }

    .process-number {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--teal-soft);
      border: 1px solid rgba(20,184,166,.18);
      color: var(--teal);
      font-family: "Manrope", sans-serif;
      font-size: .82rem;
      font-weight: 800;
    }

    .process-card h3 {
      font-size: .96rem;
      margin-bottom: 3px;
    }

    .process-card p {
      color: var(--muted);
      font-size: .76rem;
    }

    /* =========================================================
       CITIES
    ========================================================= */

    .cities-wrapper {
      padding: 25px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    }

    .cities-note {
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 17px;
    }

    .cities-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .city {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--teal-soft);
      border: 1px solid rgba(20,184,166,.16);
      color: #d7efeb;
      font-size: .76rem;
      font-weight: 600;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-grid {
      display: grid;
      gap: 30px;
    }

    .contact-copy {
      max-width: 600px;
    }

    .contact-copy p {
      color: var(--muted);
      margin-top: 13px;
      font-size: .9rem;
    }

    .contact-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 20px;
      color: var(--teal);
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      direction: ltr;
    }
