:root{
  --green:#0e7a3d; --green-d:#0a5c2e; --gold:#c9a227; --dark:#0d1117;
  --bg:#f7f7f4; --card:#fff; --text:#1c1f23; --muted:#5d646d; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
a{text-decoration:none;color:inherit}
img{width:100%;height:100%;object-fit:cover;display:block}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
section{padding:70px 0}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#fff;font-weight:800;
  padding:14px 30px;border-radius:50px;font-size:17px;transition:.25s;box-shadow:0 6px 18px rgba(14,122,61,.35)}
.btn:hover{background:var(--green-d);transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--green);border:2px solid var(--green);box-shadow:none}
.btn.ghost:hover{background:var(--green);color:#fff}
.tag{display:inline-block;background:rgba(201,162,39,.15);color:var(--gold);font-weight:700;
  padding:6px 18px;border-radius:50px;font-size:14px;margin-bottom:14px}
h2{font-size:32px;font-weight:900;margin-bottom:10px}
.sub{color:var(--muted);max-width:620px;margin:0 auto 44px;font-size:17px}
.center{text-align:center}

.topbar{background:var(--dark);color:#e8e8e8;font-size:14px;padding:9px 0}
.topbar .container{display:flex;justify-content:center;gap:26px;flex-wrap:wrap}
.topbar b{color:var(--gold)}

header{background:rgba(13,17,23,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50;
  box-shadow:0 2px 14px rgba(0,0,0,.25)}
header .container{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.logo{font-size:26px;font-weight:900;letter-spacing:1px;color:#fff}
.logo i{color:var(--gold);font-style:normal}
.logo small{display:block;font-size:11px;color:#9aa39b;font-weight:600;letter-spacing:2px}
nav a{margin:0 13px;font-weight:700;font-size:15px;color:#c9d2c9}
nav a:hover{color:var(--gold)}
header .btn{padding:10px 22px;font-size:15px}
header .tel-h{color:#fff;font-weight:800;font-size:16px;margin-left:14px;direction:ltr;display:inline-block}

.hero{position:relative;color:#fff;padding:0;min-height:640px;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to left,rgba(8,12,9,.96) 30%,rgba(8,12,9,.75) 60%,rgba(8,12,9,.45))}
.hero .container{position:relative;z-index:1;padding:90px 20px}
.hero h1{font-size:44px;font-weight:900;line-height:1.35;margin:12px 0 18px;max-width:600px}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{color:#c9d2c9;font-size:18px;max-width:520px;margin-bottom:28px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.trust-row{display:flex;gap:22px;margin-top:34px;flex-wrap:wrap}
.trust-row div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  padding:12px 18px;border-radius:12px;font-size:14px}
.trust-row b{display:block;font-size:19px;color:var(--gold)}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:var(--card);border-radius:var(--radius);padding:30px 24px;box-shadow:0 4px 20px rgba(0,0,0,.05);
  transition:.25s;border:1px solid #eee}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.1)}
.card .ic{width:56px;height:56px;border-radius:14px;background:rgba(14,122,61,.1);display:flex;
  align-items:center;justify-content:center;font-size:27px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.card a{color:var(--green);font-weight:800;font-size:15px;display:inline-block;margin-top:12px}

.prices{background:#fff}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.price{background:var(--bg);border-radius:var(--radius);padding:34px 28px;border:2px solid transparent;position:relative}
.price.pop{border-color:var(--green);background:linear-gradient(180deg,#f2faf5,var(--bg))}
.badge{position:absolute;top:-14px;right:24px;background:var(--gold);color:#fff;font-weight:800;
  font-size:13px;padding:4px 16px;border-radius:50px}
.price h3{font-size:20px;margin-bottom:6px}
.price .from{color:var(--muted);font-size:14px}
.price .num{font-size:34px;font-weight:900;color:var(--green);margin:6px 0 14px}
.price ul{list-style:none;margin-bottom:22px}
.price li{padding:6px 0;font-size:15px;color:#333}
.price li::before{content:"✓";color:var(--green);font-weight:900;margin-left:8px}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:26px}

.ba-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ba{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.ba .img{height:220px}
.ba .lbl{padding:16px 20px}
.ba .lbl b{display:block}
.ba .lbl span{color:var(--muted);font-size:14px}

.testi{background:var(--dark);color:#fff}
.testi .sub{color:#aeb8ae}
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.t{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:28px}
.t .stars{color:var(--gold);font-size:18px;letter-spacing:3px;margin-bottom:12px}
.t p{color:#d5dcd5;font-size:15px;margin-bottom:16px}
.t b{color:#fff} .t small{display:block;color:#8fae95;font-size:13px}

.b2b .container{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.b2b ul{list-style:none;margin:20px 0 30px}
.b2b li{padding:10px 0;font-size:17px;font-weight:600}
.b2b li::before{content:"◆";color:var(--gold);margin-left:12px}
.b2b-img{border-radius:var(--radius);overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.3);height:400px}

.steps{background:#fff}
.step-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.step{text-align:center;padding:30px 20px}
.step .n{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;
  font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.step h3{font-size:19px;margin-bottom:8px}
.step p{color:var(--muted);font-size:15px}

.faq{max-width:760px;margin:0 auto}
details{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 3px 14px rgba(0,0,0,.05);overflow:hidden}
summary{padding:18px 22px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"+";color:var(--green);font-size:24px;font-weight:900}
details[open] summary::after{content:"−"}
details p{padding:0 22px 20px;color:var(--muted);font-size:15px}

.final{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;text-align:center}
.final h2{font-size:34px;margin-bottom:12px}
.final p{color:#d9ecdf;margin-bottom:30px;font-size:18px}
.final .btn{background:#fff;color:var(--green);font-size:19px;padding:17px 44px}
.final .tel{display:block;margin-top:18px;color:#fff;font-weight:800;font-size:20px;direction:ltr}

footer{background:var(--dark);color:#9aa39b;padding:34px 0;font-size:14px;text-align:center}
footer b{color:#fff}

.wa-float{position:fixed;bottom:22px;left:22px;width:60px;height:60px;background:#25d366;border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:99;transition:.25s}
.wa-float:hover{transform:scale(1.1)}
.wa-float svg{width:32px;height:32px;fill:#fff}

@media(max-width:900px){
  .hero .container,.b2b .container{grid-template-columns:1fr}
  .grid4,.price-grid,.ba-grid,.t-grid,.step-grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:30px}
  nav,.tel-h{display:none}
  header .container{justify-content:center;gap:14px}
}
@media(max-width:600px){.grid4,.price-grid,.ba-grid,.t-grid,.step-grid{grid-template-columns:1fr}}
